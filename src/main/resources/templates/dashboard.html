<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <title>Dashboard</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/boots
    ap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
          rel="stylesheet">
</head>

<body class="bg-light">

<nav class="navbar navbar-dark bg-primary shadow">
    <div class="container-fluid">

        <span class="navbar-brand fw-bold">
            💰 Expense Tracker Pro
        </span>

        <div class="d-flex align-items-center">

            <span class="text-white me-3">
                Welcome,
                <strong th:text="${name}"></strong>
            </span>

            <form th:action="@{/logout}" method="post">
                <button class="btn btn-light">
                    Logout
                </button>
            </form>

        </div>

    </div>
</nav>

<div class="container-fluid">

    <div class="row">

        <!-- Sidebar -->

        <div class="col-md-2 bg-dark text-white min-vh-100 p-3">

            <h5>Menu</h5>

            <hr>

            <a href="/dashboard" class="d-block text-white mb-3 text-decoration-none">
                <i class="bi bi-house"></i>
                Dashboard
            </a>

            <a href="/expenses" class="d-block text-white mb-3 text-decoration-none">
                <i class="bi bi-wallet2"></i>
                Expenses
            </a>

            <a href="#" class="d-block text-white mb-3 text-decoration-none">
                <i class="bi bi-cash-stack"></i>
                Income
            </a>

            <a href="#" class="d-block text-white mb-3 text-decoration-none">
                <i class="bi bi-pie-chart"></i>
                Reports
            </a>

        </div>

        <!-- Main Content -->

        <div class="col-md-10 p-4">

            <h2>Dashboard</h2>

            <div class="row mt-4">

                <div class="col-md-3">

                    <div class="card shadow border-0">

                        <div class="card-body">

                            <h6>Total Expense</h6>

                            <h3>₹0</h3>

                        </div>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow border-0">

                        <div class="card-body">

                            <h6>Total Income</h6>

                            <h3>₹0</h3>

                        </div>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow border-0">

                        <div class="card-body">

                            <h6>Balance</h6>

                            <h3>₹0</h3>

                        </div>

                    </div>

                </div>

                <div class="col-md-3">

                    <div class="card shadow border-0">

                        <div class="card-body">

                            <h6>Transactions</h6>

                            <h3>0</h3>

                        </div>

                    </div>

                </div>

            </div>

            <div class="card mt-5 shadow">

                <div class="card-header">

                    Recent Transactions

                </div>

                <div class="card-body">

                    <p class="text-muted">
                        No transactions yet.
                    </p>

                </div>

            </div>

        </div>

    </div>

</div>

</body>
</html>
