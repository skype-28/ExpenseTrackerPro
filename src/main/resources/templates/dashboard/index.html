<!DOCTYPE html>

<html xmlns:th="http://www.thymeleaf.org">

<head>

    <title>Dashboard</title>

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet">

    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.13.1/font/bootstrap-icons.css"
            rel="stylesheet">

    <link
            th:href="@{/css/dashboard.css}"
            rel="stylesheet">

</head>

<body class="bg-light">

<div th:replace="~{fragments/navbar :: navbar}"></div>

<div class="d-flex">

    <div th:replace="~{fragments/sidebar :: sidebar}"></div>

    <div class="container-fluid p-4">

        <h2 class="fw-bold mb-4">

            Dashboard

        </h2>

        <div class="row">

            <div class="col-lg-3">

                <div class="card summary-card">

                    <div class="card-body">

                        <h6>Total Expense</h6>

                        <h2 th:text="'₹' + ${dashboard.totalExpense}"></h2>

                    </div>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="card summary-card">

                    <div class="card-body">

                        <h6>Total Income</h6>

                        <h2>₹0</h2>

                    </div>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="card summary-card">

                    <div class="card-body">

                        <h6>Balance</h6>

                        <h2 th:text="'₹' + ${dashboard.balance}"></h2>

                    </div>

                </div>

            </div>

            <div class="col-lg-3">

                <div class="card summary-card">

                    <div class="card-body">

                        <h6>Transactions</h6>

                        <h2 th:text="${dashboard.totalTransactions}"></h2>

                    </div>

                </div>

            </div>

        </div>

        <div class="row mt-5">

            <div class="col-lg-8">

                <div class="card shadow-sm">

                    <div class="card-header">

                        Monthly Expense

                    </div>

                    <div class="card-body">

                        <canvas id="expenseChart"></canvas>

                    </div>

                </div>

            </div>

            <div class="col-lg-4">

                <div class="card shadow-sm">

                    <div class="card-header">

                        Quick Actions

                    </div>

                    <div class="card-body d-grid gap-2">

                        <a
                                th:href="@{/expenses/add}"
                                class="btn btn-primary">

                            Add Expense

                        </a>

                        <a
                                href="#"
                                class="btn btn-success">

                            Add Income

                        </a>

                        <a
                                href="#"
                                class="btn btn-warning">

                            Export PDF

                        </a>

                    </div>

                </div>

            </div>

        </div>

        <div class="card mt-4 shadow-sm">

            <div class="card-header">

                Recent Transactions

            </div>

            <div class="card-body">

                <table class="table table-hover">

                    <thead>

                    <tr>

                        <th>Date</th>
                        <th>Title</th>
                        <th>Category</th>
                        <th>Amount</th>

                    </tr>

                    </thead>

                    <tbody>

                    <tr>

                        <td colspan="4"
                            class="text-center text-muted">

                            No Transactions Found

                        </td>

                    </tr>

                    </tbody>

                </table>

            </div>

        </div>

    </div>

</div>

<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

<script src="/js/dashboard.js"></script>

</body>

</html>
